# Ворота при подъезде к даче: въезд в зону «Рядом с дачей» (3 км) — пуш приехавшему
# с кнопками «Ворота» / «Калитка». Автооткрытие по Wi-Fi отвергнуто замером 2026-10-18:
# телефон цепляется к Keenetic-9102 уже у дома и переподключается в течение дня.
gate_arrival:
  automation:
    - id: gate_arrival_prompt
      alias: gate_arrival_prompt
      mode: parallel
      max: 4
      triggers:
        - trigger: zone
          entity_id: [person.artemevk, person.artemevam]
          zone: zone.near
          event: enter
      conditions:
        # только приезд издалека, а не выход с участка в зону
        - condition: template
          value_template: "{{ trigger.from_state.state == 'not_home' }}"
      actions:
        - variables:
            phone: "mobile_app_{{ (state_attr(trigger.entity_id, 'device_trackers') | first).split('.')[1] }}"
            open_id: "GATE_OPEN_{{ context.id }}"
            wicket_id: "GATE_WICKET_{{ context.id }}"
        - action: script.notify_push
          data:
            target: "{{ phone }}"
            title: Подъезжаете к даче
            message: Открыть ворота или калитку?
            data:
              tag: gate_arrival
              actions:
                - action: "{{ open_id }}"
                  title: Ворота
                  icon: sfsymbols:car
                - action: "{{ wicket_id }}"
                  title: Калитка
                  icon: sfsymbols:figure.walk
        - wait_for_trigger:
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ open_id }}"
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: "{{ wicket_id }}"
          timeout: "00:20:00"
          continue_on_timeout: false
        - if:
            - condition: template
              value_template: "{{ wait.trigger.event.data.action == open_id }}"
          then:
            - action: script.turn_on
              target:
                entity_id: script.gate_step_mode
          else:
            - action: script.turn_on
              target:
                entity_id: script.gate_pedestrian_crossing
        - action: logbook.log
          data:
            name: Ворота
            message: >-
              {{ 'ворота' if wait.trigger.event.data.action == open_id else 'калитка' }}
              открыты с пуша ({{ state_attr(trigger.entity_id, 'friendly_name') }})
