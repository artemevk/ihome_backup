# iHome: «все уехали» — пуш с подтверждением, постановка на охрану через 10 минут,
# «выключение дачи» при armed_away; гости; автоснятие охраны при возвращении.
away_mode:
  input_boolean:
    guests:
      name: Гости на даче
      icon: mdi:account-group

  script:
    # Выключение дачи: бойлеры, свет в доме и бане, отопление в антизамерзание.
    # Просушку бани не ломает: в 23:00 она сама выключит термостат и включит котёл.
    away_shutdown:
      alias: Дача — выключить всё при отъезде
      sequence:
        - action: switch.turn_off
          target:
            entity_id: [switch.water_heater, switch.bathhouse_boiler]
        - action: light.turn_off
          target:
            entity_id: [light.house, light.bathhouse]
        - action: script.antifrost_mode
        - action: climate.set_preset_mode
          target:
            entity_id: climate.bathhouse_thermostat
          data:
            preset_mode: away
        - action: script.notify_push
          data:
            target: alarm
            title: Охрана
            message: >-
              Дача на охране: бойлеры выключены, свет погашен, отопление в антизамерзании
              {%- if is_state('input_boolean.bathhouse_drying_armed', 'on') %}; просушка бани ночью — по плану{% endif %}.

  automation:
    - id: away_arm_prompt
      alias: away_arm_prompt
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: state
          entity_id: zone.home
          to: "0"
          for: "00:05:00"
      conditions:
        - condition: state
          entity_id: alarm_control_panel.master
          state: disarmed
        - condition: state
          entity_id: input_boolean.guests
          state: "off"
      actions:
        - variables:
            prompt:
              title: Охрана
              message: "Все уехали с дачи — через 10 мин ставлю на охрану и выключаю бойлеры, свет и отопление."
              data:
                url: /lovelace/security
                actions:
                  - action: IHOME_ARM_NOW
                    title: Поставить сейчас
                  - action: IHOME_GUESTS
                    title: На даче гости
        - action: script.notify_push
          data:
            target: alarm
            title: "{{ prompt.title }}"
            message: "{{ prompt.message }}"
            data: "{{ prompt.data }}"
        - action: script.notify_push
          data:
            target: mobile_app_artemevp
            title: "{{ prompt.title }}"
            message: "{{ prompt.message }}"
            data: "{{ prompt.data }}"
        - wait_for_trigger:
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: IHOME_ARM_NOW
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: IHOME_GUESTS
          timeout: "00:10:00"
          continue_on_timeout: true
        - choose:
            - conditions: "{{ wait.trigger is not none and wait.trigger.event.data.action == 'IHOME_GUESTS' }}"
              sequence:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.guests
                - action: script.notify_push
                  data:
                    target: alarm
                    title: Охрана
                    message: Включён режим «Гости на даче» — охрану не ставлю, ничего не выключаю.
            - conditions:
                - condition: state
                  entity_id: zone.home
                  state: "0"
                - condition: state
                  entity_id: input_boolean.guests
                  state: "off"
                - condition: state
                  entity_id: alarm_control_panel.master
                  state: disarmed
              sequence:
                - action: alarm_control_panel.alarm_arm_away
                  target:
                    entity_id: alarm_control_panel.master

    # Как бы ни поставили на охрану «Не дома» (автоматически или вручную) — выключить дачу.
    - id: away_shutdown_on_arm
      alias: away_shutdown_on_arm
      triggers:
        - trigger: state
          entity_id: alarm_control_panel.master
          to: armed_away
      actions:
        - action: script.away_shutdown

    # Вернулись — снять охрану и сбросить «Гости на даче».
    - id: away_disarm_on_return
      alias: away_disarm_on_return
      triggers:
        - trigger: numeric_state
          entity_id: zone.home
          above: 0
      actions:
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: alarm_control_panel.master
                  state: disarmed
          then:
            - action: alarm_control_panel.alarm_disarm
              target:
                entity_id: alarm_control_panel.master
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.guests
