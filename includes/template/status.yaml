# Вспомогательные сенсоры для значков в шапке «Главной» (iHome).
sensor:
  # Режим отопления одним значком вместо двух (дом и баня).
  - default_entity_id: sensor.heating_mode
    unique_id: heating_mode
    name: Отопление
    icon: >-
      {{ 'mdi:snowflake-thermometer' if is_state('binary_sensor.antifrost_mode', 'on')
         and is_state('binary_sensor.bathhouse_antifrost_mode', 'on') else 'mdi:radiator' }}
    # «Антизамерзание» — только если в нём и дом, и баня (режим экономии на пустой даче);
    # если хоть что-то греется в обычном режиме — «Обычный».
    state: >-
      {{ 'Антизамерзание' if is_state('binary_sensor.antifrost_mode', 'on')
         and is_state('binary_sensor.bathhouse_antifrost_mode', 'on') else 'Обычный' }}

  # Недоступные устройства — только Zigbee (MQTT) и только «настоящие» сущности:
  # служебные select/number спящих пультов «недоступны» штатно.
  - default_entity_id: sensor.unavailable_devices
    unique_id: unavailable_devices
    name: Недоступно устройств
    icon: mdi:lan-disconnect
    state: >-
      {{ integration_entities('mqtt') | select('match', '^(sensor|binary_sensor|switch|light|climate|cover|lock|valve)\.')
         | select('is_state', 'unavailable') | list | count }}
    attributes:
      entities: >-
        {{ integration_entities('mqtt') | select('match', '^(sensor|binary_sensor|switch|light|climate|cover|lock|valve)\.')
           | select('is_state', 'unavailable') | list }}
