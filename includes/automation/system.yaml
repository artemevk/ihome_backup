- id: Сжатие базы
  alias: 00_purge_everyday
  initial_state: true
  triggers:
    - trigger: time
      at: "01:00:00"
  actions:
    - action: recorder.purge
      data:
        keep_days: 5
        repack: true

- id: l1k3
  alias: push_HA_configuration_to_GitHub_repo
  initial_state: true
  triggers:
    # Everyday at 23:23:23 time
    - trigger: time
      at: "23:23:23"
  actions:
    - action: shell_command.push_to_github

      # https://peyanski.com/automatic-home-assistant-backup-to-github/
      # Чтобы сделать бэкап на Github нужно выполнить команды:
      # 1. ls config
      # 2. git remote set-url origin https://github.com/artemevk/country_house_backup.git
      # 3. ./ha_gitpush.sh

- id: mplens_down
  alias: mplens недоступен
  triggers:
    - trigger: template
      value_template: "{{ states('sensor.mplens_status') != 'healthy' }}"
      for: "00:06:00"
  actions:
    - action: notify.mobile_app_artemevk
      data:
        title: "mplens недоступен"
        message: "Статус: {{ states('sensor.mplens_status') }}"

- id: mplens_up
  alias: mplens снова работает
  triggers:
    - trigger: state
      entity_id: sensor.mplens_status
      to: "healthy"
      for: "00:02:00"
  actions:
    - action: notify.mobile_app_artemevk
      data:
        message: "mplens снова работает"

- id: start_offline_timer
  alias: start_offline_timer
  initial_state: true
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.iflat_connection
      to: "off"
  actions:
    - action: timer.start
      target:
        entity_id: timer.iflat_offline

- id: iflat_disconnected
  alias: iflat_disconnected
  triggers:
    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.iflat_offline
  actions:
    - action: telegram_bot.send_message
      data:
        chat_id: !secret tlg_user1_id
        message: "Сервер iFlat не отвечает!"
    - action: notify.mobile_app_artemevk
      data:
        message: "Сервер iFlat не отвечает!"

- id: cancel_offline_timer
  alias: cancel_offline_timer
  initial_state: true
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.iflat_connection
      to: "on"
  actions:
    - action: timer.cancel
      target:
        entity_id: timer.iflat_offline

- id: porch_timelapce
  alias: porch_timelapce
  initial_state: false
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - alias: "Time 9~18"
      condition: time
      after: "09:00:00"
      before: "18:00:00"
  actions:
    - action: camera.snapshot
      target:
        entity_id: camera.courtyard_camera_mainstream
      data:
        filename: '/config/tmp/courtyard_camera_{{ now().strftime("%Y%m%d-%H%M%S") }}.jpg'
