- id: Сжатие базы
  alias: 00_purge_everyday
  initial_state: true
  triggers:
    - trigger: time
      at: "01:00:00"
  actions:
    - action: recorder.purge
      data:
        keep_days: 5
        repack: true

- id: l1k3
  alias: push_HA_configuration_to_GitHub_repo
  initial_state: true
  triggers:
    # Everyday at 23:23:23 time
    - trigger: time
      at: "23:23:23"
  actions:
    - action: shell_command.push_to_github

      # https://peyanski.com/automatic-home-assistant-backup-to-github/
      # Чтобы сделать бэкап на Github нужно выполнить команды:
      # 1. ls config
      # 2. git remote set-url origin https://github.com/artemevk/country_house_backup.git
      # 3. ./ha_gitpush.sh

# Одна автоматизация на весь эпизод: «снова работает» приходит только после
# «недоступен», поэтому короткие сбои опроса (один неудачный запрос) молчат.
- id: mplens_down
  alias: mplens недоступен
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: template
      value_template: "{{ states('sensor.mplens_status') != 'healthy' }}"
      for: "00:06:00"
  actions:
    - variables:
        down_since: "{{ now() - timedelta(minutes=6) }}"
    - action: script.notify_push
      data:
        target: mobile_app_artemevk
        title: "mplens недоступен"
        message: "Статус: {{ states('sensor.mplens_status') }}"
    - wait_for_trigger:
        - trigger: state
          entity_id: sensor.mplens_status
          to: "healthy"
          for: "00:02:00"
    - action: script.notify_push
      data:
        target: mobile_app_artemevk
        title: "mplens снова работает"
        message: >-
          Был недоступен ~{{ ((now() - as_datetime(down_since)).total_seconds() // 60) | int }} мин
          (с {{ (as_datetime(down_since) | as_local).strftime('%H:%M') }})

# Как mplens: «не отвечает» после 3 мин офлайна, «снова работает» — только после него.
- id: iflat_disconnected
  alias: iFlat не отвечает
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: binary_sensor.iflat_connection
      to: "off"
      for: "00:03:00"
  actions:
    - variables:
        down_since: "{{ now() - timedelta(minutes=3) }}"
        msg: "Сервер iFlat не отвечает!"
    - &iflat_notify
      sequence:
        - action: script.notify_push
          data:
            target: mobile_app_artemevk
            message: "{{ msg }}"
        # Telegram — только если telegram_bot поднялся (без VPN не поднимается),
        # иначе ошибка «действие не найдено» остановит автоматизацию.
        - if:
            - condition: template
              value_template: "{{ integration_entities('telegram_bot') | select('has_value') | list | count > 0 }}"
          then:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: !secret tlg_user1_id
                message: "{{ msg }}"
    - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.iflat_connection
          to: "on"
          for: "00:01:00"
    - variables:
        msg: >-
          Сервер iFlat снова работает (был недоступен
          ~{{ ((now() - as_datetime(down_since)).total_seconds() // 60) | int }} мин,
          с {{ (as_datetime(down_since) | as_local).strftime('%H:%M') }})
    - *iflat_notify

- id: porch_timelapce
  alias: porch_timelapce
  initial_state: false
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - alias: "Time 9~18"
      condition: time
      after: "09:00:00"
      before: "18:00:00"
  actions:
    - action: camera.snapshot
      target:
        entity_id: camera.courtyard_camera_mainstream
      data:
        filename: '/config/tmp/courtyard_camera_{{ now().strftime("%Y%m%d-%H%M%S") }}.jpg'

# Zigbee2MQTT (application-фаза) стартует только после ядра, а ядро на даче
# по несколько минут ждёт xiaomi_gateway3. Сенсоры Supervisor «работает» при этом
# залипают, поэтому судим по мосту Z2M в MQTT: он «on», только если Z2M реально работает.
# app_start по уже работающему аддону Supervisor игнорирует («already running»).
- id: zigbee2mqtt_start_guard
  alias: Страховка запуска Zigbee2MQTT
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:10:00"
    - variables:
        bridges: &z2m_bridges
          - binary_sensor.zigbee2mqtt_bridge_connection_state
          - binary_sensor.zigbee2mqtt_bridge_connection_state_2
        down: "{{ bridges | reject('is_state', 'on') | list }}"
    - condition: "{{ down | count > 0 }}"
    - repeat:
        for_each: [9336c2b0_zigbee2mqtt, 45df7312_zigbee2mqtt]
        sequence:
          - action: hassio.app_start
            continue_on_error: true
            data:
              app: "{{ repeat.item }}"
    - delay: "00:03:00"
    - variables:
        still_down: "{{ bridges | reject('is_state', 'on') | list }}"
    - action: script.notify_push
      data:
        target: mobile_app_artemevk
        title: Zigbee2MQTT
        message: >-
          {%- if still_down | count == 0 -%}
            Zigbee2MQTT не был на связи через 10 мин после старта HA — запустил, теперь работает.
          {%- else -%}
            Zigbee2MQTT не поднялся и после повторного запуска: {{ still_down | join(', ') }}. Нужно смотреть журнал аддона.
          {%- endif %}
